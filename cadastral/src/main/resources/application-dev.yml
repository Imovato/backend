server:
  port: 5757

spring:
  application:
    name: cadastral
  config:
    import: "optional:configserver:"
  cloud:
    config:
      discovery:
        service-id: config-server
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  jpa:
    generate-ddl: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  jmx:
    enabled: false
  data:
    mongodb:
      host: localhost
      port: 27017
      database: cadastral
      auto-index-creation: true
  rabbitmq:
    host: localhost
    port: 5672
    username: un_user
    password: un_user

crud:
  rabbitmq:
    exchanges:
      exchangeAccommodations: crud.fanout.register-accommodations
      exchangeUsers: crud.fanout.register-users
    queues:
      accommodationQueue: crud.register-accommodations.queue
      userQueue: crud.register-users.queue
      accommodationStatusQueue: crud.update-accommodations.queue

ead:
  serviceRegistry:
    username: un_user
    password: "un_user"

eureka:
  client:
    registerWithEureka: true
    fetchRegistry: true
    service-url:
      defaultZone: "http://${ead.serviceRegistry.username}:${ead.serviceRegistry.password}@localhost:8761/eureka"

app:
  mail:
    from: ${MAIL_FROM:no-reply@imovato.local}
  uploads-dir: C:/Users/Samuel Modesto/OneDrive/Documentos/Projetos/TCC/imovato/backend/cadastral/uploads/
